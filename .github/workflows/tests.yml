name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install pinned development validators
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Validate format, dependencies and local references
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/validate_package.py
          python -m unittest discover -s tests -p test_package_validation.py -v
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Runtime and tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python --version
          python -m unittest discover -s tests -v
